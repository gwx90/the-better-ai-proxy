# The better AI proxy — subscription-free routing template.
# Link your own providers in FlClash's native custom profile editor.
---
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: error
ipv6: true
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
dns:
  enable: true
  prefer-h3: false
  ipv6: false
  ipv6-timeout: 100
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  fallback:
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: []
    domain:
    geosite: []
  fallback-lazy-query: false
  listen: ''
  listen-routing-mark: 0
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: ''
  fake-ip-filter:
  - dns.msftnsci.com
  - www.msftnsci.com
  - www.msftconnecttest.com
  - localhost
  - "+.localhost"
  fake-ip-filter-mode: blacklist
  fake-ip-ttl: 1
  default-nameserver:
  - 114.114.114.114
  - 223.5.5.5
  - 8.8.8.8
  - 1.0.0.1
  cache-algorithm: lru
  cache-max-size: 0
  nameserver-policy:
  proxy-server-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver-policy:
  direct-nameserver:
  direct-nameserver-follow-policy: false
proxy-providers: {}
proxy-groups:
